name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest       # Apple Silicon
            asset: dist/PDF-Distiller-macOS.dmg
          - os: macos-15-intel     # Intel Macs (still common among students' older laptops)
            asset: dist/PDF-Distiller-macOS-Intel.dmg
          - os: windows-latest
            asset: dist/PDF-Distiller-Windows.zip
    runs-on: ${{ matrix.os }}
    env:  # a step's `if` cannot read secrets directly
      HAS_MAC_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
      HAS_WIN_CERT: ${{ secrets.WINDOWS_CERT_PFX != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
      # exact versions the release was tested with (packaging/requirements-release.txt, kept current by Dependabot)
      - run: pip install -c packaging/requirements-release.txt ".[dev,window]" pyinstaller
      - run: python -m pytest -q
      # Signing runs only when the repository has these secrets (docs/signing.md); otherwise the build
      # is unsigned, as before.
      - name: Import macOS signing certificate
        if: runner.os == 'macOS' && env.HAS_MAC_CERT == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/sign.keychain-db"; KCPW="$(uuidgen)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KCPW" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
      - name: Decode Windows signing certificate
        if: runner.os == 'Windows' && env.HAS_WIN_CERT == 'true'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "sign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
          "WINDOWS_SIGN_PFX=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Append
      - run: python packaging/build.py
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          WINDOWS_SIGN_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
      - name: Zip Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/PDF Distiller.exe", dist/LICENSE, dist/THIRD_PARTY_NOTICES.md, dist/licenses -DestinationPath dist/PDF-Distiller-Windows.zip
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # v3.0.4
        with:
          files: ${{ matrix.asset }}
