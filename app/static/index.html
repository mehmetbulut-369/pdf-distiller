<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF Distiller</title>
<link rel="icon" href="/static/logo.svg" type="image/svg+xml">
<!-- before the stylesheet so a saved theme applies on the first paint (no flash of the other theme) -->
<script>try { const t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (_) {}</script>
<link rel="stylesheet" href="/static/style.css?v=0.5">
</head>
<body class="nodoc">
<header class="bar">
  <img class="logo" src="/static/logo.svg" alt="" width="28" height="28">
  <strong class="brand">PDF Distiller</strong>
  <span id="ver" class="ver"></span>
  <label class="btn" for="file" data-i18n="app.open">Open PDF</label>
  <input type="file" id="file" accept="application/pdf,.pdf" hidden>
  <span id="docname" class="docname"></span>
  <span class="spacer"></span>
  <div class="seg" id="viewmode" role="radiogroup" data-i18n-aria-label="view.label">
    <button data-v="before" role="radio" data-i18n="view.before">Original</button>
    <button data-v="split" role="radio" class="on" data-i18n="view.split">Side by side</button>
    <button data-v="after" role="radio" data-i18n="view.after">Result</button>
  </div>
  <button id="undo" class="btn ghost" data-i18n="undo" data-i18n-title="undo.title" disabled>Undo</button>
  <button id="export" class="btn primary" data-i18n="export" disabled>Download print PDF</button>
  <!-- Language as flags (as on kariyeraday.de): SVG because emoji flags don't render on Windows;
       each language is named in itself so a lost user still finds theirs. -->
  <nav id="lang" class="langflags" data-i18n-aria-label="lang.label">
    <button data-lang="en" aria-label="English" title="English"><span class="flag"><svg viewBox="0 0 60 30" preserveAspectRatio="xMidYMid slice">
      <clipPath id="fUKt"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath>
      <path d="M0,0 v30 h60 v-30 z" fill="#012169"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#FFFFFF" stroke-width="6"/>
      <path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#fUKt)" stroke="#C8102E" stroke-width="4"/>
      <path d="M30,0 v30 M0,15 h60" stroke="#FFFFFF" stroke-width="10"/><path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6"/></svg></span></button>
    <button data-lang="de" aria-label="Deutsch" title="Deutsch"><span class="flag"><svg viewBox="0 0 5 3">
      <rect width="5" height="1" fill="#000000"/><rect width="5" height="1" y="1" fill="#DD0000"/><rect width="5" height="1" y="2" fill="#FFCC00"/></svg></span></button>
    <button data-lang="tr" aria-label="Türkçe" title="Türkçe"><span class="flag"><svg viewBox="0 0 30 20">
      <rect width="30" height="20" fill="#E30A17"/><circle cx="11.25" cy="10" r="5" fill="#FFFFFF"/><circle cx="12.5" cy="10" r="4" fill="#E30A17"/>
      <polygon fill="#FFFFFF" points="14.40,10.00 16.13,9.44 16.13,7.62 17.20,9.09 18.92,8.53 17.85,10.00 18.92,11.47 17.20,10.91 16.13,12.38 16.13,10.56"/></svg></span></button>
  </nav>
  <!-- day/night: without a saved pick the system preference applies; CSS picks the icon -->
  <button id="theme" class="themeswitch" aria-pressed="false" data-i18n-aria-label="theme.dark" data-i18n-title="theme.dark">
    <svg class="to-dark" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24"><path fill="currentColor"
      d="M20.5 14.6A8.6 8.6 0 0 1 9.4 3.5a.6.6 0 0 0-.8-.7A9.4 9.4 0 1 0 21.2 15.4a.6.6 0 0 0-.7-.8Z"/></svg>
    <svg class="to-light" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.6" fill="currentColor"/>
      <path d="M12 2.2v2.2M12 19.6v2.2M2.2 12h2.2M19.6 12h2.2M5.1 5.1l1.5 1.5M17.4 17.4l1.5 1.5M5.1 18.9l1.5-1.5M17.4 6.6l1.5-1.5"
      stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
</header>

<main id="app" class="app">
  <aside class="panel" data-i18n-aria-label="panel.label">
    <section class="gauge" aria-live="polite">
      <div class="cartridges">
        <div class="cart"><div class="tank"><div class="ink" id="inkBefore"></div></div><span data-i18n="view.before">Original</span></div>
        <div class="cart"><div class="tank"><div class="ink after" id="inkAfter"></div></div><span data-i18n="view.after">Result</span></div>
      </div>
      <div class="saving">
        <div class="big" id="savingPct">–</div>
        <div class="small" id="savingNote" data-i18n="gauge.less_ink">less ink</div>
      </div>
    </section>
    <details class="dots" id="dots" hidden>
      <summary><strong id="dotsLine"></strong> <span class="how" data-i18n="dots.how_title">How we count</span></summary>
      <p id="dotsHow"></p>
    </details>

    <section class="inkhot" id="inkHot" hidden>
      <h2 data-i18n="ink.title">Uses the most ink</h2>
      <p class="hint" data-i18n="ink.hint"></p>
      <ol class="inklist" id="inkList"></ol>
    </section>

    <section>
      <h2 data-i18n="tiers.title">Saving level</h2>
      <div class="tiers" id="tiers" role="radiogroup" data-i18n-aria-label="tiers.label"></div>
    </section>

    <details class="block">
      <summary data-i18n="remove.title">Fine-tune (optional)</summary>
      <label class="chk"><input type="checkbox" data-s="remove_backgrounds"> <span data-i18n="s.remove_backgrounds"></span> <i class="sw bg"></i></label>
      <label class="chk"><input type="checkbox" data-s="remove_repeated"> <span data-i18n="s.remove_repeated"></span> <i class="sw rep"></i></label>
      <label class="chk"><input type="checkbox" data-s="remove_large_images"> <span data-i18n="s.remove_large_images"></span> <i class="sw lg"></i></label>
      <label class="chk"><input type="checkbox" data-s="remove_large_shapes"> <span data-i18n="s.remove_large_shapes"></span> <i class="sw lg"></i></label>
      <label class="chk"><input type="checkbox" data-s="remove_all_graphics"> <span data-i18n="s.remove_all_graphics"></span></label>
      <label class="chk"><input type="checkbox" data-s="remove_repeated_text"> <span data-i18n="s.remove_repeated_text"></span> <i class="sw tx"></i></label>
      <label class="chk"><input type="checkbox" data-s="keep_text_images"> <span data-i18n="s.keep_text_images"></span> <i class="sw ti"></i></label>
      <p class="hint indent" data-i18n="s.keep_text_images_hint"></p>
      <label class="chk"><input type="checkbox" data-s="auto_crop_photos"> <span data-i18n="s.auto_crop_photos"></span></label>

      <label class="rng"><span data-i18n="s.large_threshold"></span> <output data-o="large_threshold"></output>
        <input type="range" min="1" max="60" step="1" data-s="large_threshold" data-scale="100"></label>
      <label class="rng"><span data-i18n="s.repeat_ratio"></span> <output data-o="repeat_ratio"></output>
        <input type="range" min="5" max="90" step="5" data-s="repeat_ratio" data-scale="100"></label>
      <label class="rng"><span data-i18n="s.background_coverage"></span> <output data-o="background_coverage"></output>
        <input type="range" min="30" max="100" step="5" data-s="background_coverage" data-scale="100"></label>
    </details>

    <details class="block">
      <summary data-i18n="textcolor.title">Text and color</summary>
      <label class="sel"><span data-i18n="s.text_mode"></span>
        <select data-s="text_mode">
          <option value="keep" data-i18n="text_mode.keep"></option>
          <option value="auto" data-i18n="text_mode.auto"></option>
          <option value="black" data-i18n="text_mode.black"></option>
        </select>
      </label>
      <label class="chk"><input type="checkbox" data-s="grayscale"> <span data-i18n="s.grayscale"></span></label>
      <label class="rng"><span data-i18n="s.image_fade"></span> <output data-o="image_fade"></output>
        <input type="range" min="0" max="80" step="10" data-s="image_fade" data-scale="100"></label>
    </details>

    <details class="block" open>
      <summary data-i18n="paper.title">Paper</summary>
      <div class="seg wide" id="nup" role="radiogroup" data-i18n-aria-label="paper.label">
        <button data-n="1" role="radio">1</button><button data-n="2" role="radio">2</button><button data-n="4" role="radio">4</button><button data-n="6" role="radio">6</button>
      </div>
      <p class="hint" data-i18n="paper.hint"></p>
    </details>

    <details class="block">
      <summary data-i18n="profiles.title">Profiles</summary>
      <select id="profiles" data-i18n-aria-label="profiles.label"></select>
      <div class="row">
        <button class="btn" id="profApply" data-i18n="profiles.apply">Apply</button>
        <button class="btn" id="profSave" data-i18n="profiles.save">Save settings</button>
        <button class="btn ghost" id="profDelete" data-i18n="profiles.delete">Delete</button>
      </div>
    </details>
  </aside>
  <div class="gutter" id="gutL" role="separator" aria-orientation="vertical" tabindex="0" data-i18n-aria-label="gutter.label" data-i18n-title="gutter.label"></div>

  <section class="stage" data-i18n-aria-label="stage.label">
    <div class="stagebar">
      <button class="btn ghost icon" id="prev" data-i18n-aria-label="nav.prev">‹</button>
      <span id="pageLabel">–</span>
      <button class="btn ghost icon" id="next" data-i18n-aria-label="nav.next">›</button>
      <div class="seg tool" id="tool" role="radiogroup" data-i18n-aria-label="tool.label">
        <button data-t="graphics" role="radio" class="on" data-i18n="tool.graphics" data-i18n-title="tool.graphics_title">Graphics</button>
        <button data-t="text" role="radio" data-i18n="tool.text" data-i18n-title="tool.text_title">Select text</button>
        <button data-t="crop" role="radio" data-i18n="tool.crop" data-i18n-title="tool.crop_title">Crop</button>
      </div>
      <span class="spacer"></span>
      <label class="chk inline"><input type="checkbox" id="showOverlay" checked> <span data-i18n="overlay.show"></span></label>
      <!-- only under 1100 px, where the right rail becomes a drawer -->
      <button class="btn railtoggle" id="railToggle" aria-expanded="false" aria-controls="rail" data-i18n="rail.open">Pages & layers</button>
    </div>
    <div class="cropbar" id="cropbar" hidden>
      <span id="cropStatus" class="cropstatus"></span>
      <div class="seg" id="cropShape" role="radiogroup" data-i18n-aria-label="crop.shape_label">
        <button data-v="rect" class="on" data-i18n="crop.rect" data-i18n-title="crop.rect_title"></button><button data-v="free" data-i18n="crop.free" data-i18n-title="crop.free_title"></button>
      </div>
      <div class="seg" id="cropMode" role="radiogroup" data-i18n-aria-label="crop.mode_label">
        <button data-v="erase" class="on" data-i18n="crop.erase" data-i18n-title="crop.erase_title"></button><button data-v="keep" data-i18n="crop.keep" data-i18n-title="crop.keep_title"></button>
      </div>
      <label class="chk inline"><input type="checkbox" id="cropAll"> <span id="cropAllLabel"></span></label>
      <span class="spacer"></span>
      <button class="btn small" id="cropAuto" data-i18n="crop.auto" data-i18n-title="crop.auto_title"></button>
      <button class="btn ghost small" id="cropClear" data-i18n="crop.clear"></button>
      <button class="btn small" id="cropDone" data-i18n="crop.done"></button>
    </div>
    <div class="inkwarn" id="inkWarn" role="status" hidden></div>
    <div class="views" id="views" data-mode="split">
      <figure class="sheet before"><div class="frame"><img id="imgBefore" data-i18n-alt="preview.original_alt" alt=""><div class="overlay" id="overlay"></div></div>
        <figcaption><span id="capBefore"></span>
          <span class="legend" id="legendGraphics">
            <span><i class="sw bg"></i><span data-i18n="cls.background"></span></span><span><i class="sw rep"></i><span data-i18n="cls.repeated"></span></span>
            <span><i class="sw lg"></i><span data-i18n="cls.large"></span></span><span><i class="sw ti"></i><span data-i18n="cls.text_image"></span></span><span><i class="sw ot"></i><span data-i18n="cls.other"></span></span>
            <span><i class="sw x-drop"></i><span data-i18n="legend.dropped"></span></span><span><i class="sw x-manual"></i><span data-i18n="legend.manual"></span></span>
          </span>
          <span class="legend" id="legendText" hidden>
            <span><i class="sw tx"></i><span data-i18n="cls.text"></span></span><span><i class="sw txr"></i><span data-i18n="legend.same_every_page"></span></span><span><i class="sw rg"></i><span data-i18n="legend.region"></span></span>
          </span>
        </figcaption></figure>
      <div class="gutter pagegutter" id="gutV" role="separator" aria-orientation="vertical" tabindex="0" data-i18n-aria-label="gutter.label" data-i18n-title="gutter.label"></div>
      <figure class="sheet after"><div class="frame"><img id="imgAfter" data-i18n-alt="preview.processed_alt" alt=""><div class="busy" id="busy"></div></div>
        <figcaption data-i18n="preview.after_caption"></figcaption></figure>
    </div>
  </section>

  <div class="gutter" id="gutR" role="separator" aria-orientation="vertical" tabindex="0" data-i18n-aria-label="gutter.label" data-i18n-title="gutter.label"></div>
  <div class="railscrim" id="railScrim"></div>
  <aside class="rail" id="rail" data-i18n-aria-label="rail.label">
    <div class="tabs" role="tablist">
      <button role="tab" id="tabPages" aria-selected="true" aria-controls="panePages" data-i18n="tab.pages">Pages</button>
      <button role="tab" id="tabLayers" aria-selected="false" aria-controls="paneLayers" data-i18n="tab.layers">Layers</button>
      <button role="tab" id="tabWords" aria-selected="false" aria-controls="paneWords" data-i18n="tab.words">Words</button>
      <button class="railclose" id="railClose" data-i18n-aria-label="rail.close" data-i18n-title="rail.close">✕</button>
    </div>
    <div id="paneLayers" role="tabpanel" hidden>
      <p class="hint layershint" data-i18n="layers.hint"></p>
      <ol id="layers" class="layers"></ol>
    </div>
    <div id="panePages" role="tabpanel">
      <div class="railhead"><span id="railCount"></span><button class="btn ghost small" id="resetPages" data-i18n="pages.reset">Reset</button></div>
      <ol id="thumbs" class="thumbs"></ol>
    </div>
    <div id="paneWords" role="tabpanel" hidden>
      <div class="wordtools">
        <input type="search" id="wordSearch" data-i18n-placeholder="words.search" data-i18n-aria-label="words.search">
        <div class="row">
          <button class="btn small" id="wordSort" data-i18n-title="words.sort_title"></button>
          <button class="btn ghost small" id="wordCsv" data-i18n-title="words.csv_title">CSV</button>
        </div>
        <label class="chk small"><input type="checkbox" id="wStop" checked> <span data-i18n="words.hide_common"></span></label>
        <label class="chk small"><input type="checkbox" id="wNum" checked> <span data-i18n="words.hide_numbers"></span></label>
        <label class="chk small"><input type="checkbox" id="wRemoved" checked> <span data-i18n="words.skip_removed"></span></label>
        <div class="wordsum" id="wordSum"></div>
      </div>
      <ol class="words" id="words"></ol>
    </div>
  </aside>
</main>

<div id="empty" class="empty">
  <div class="start">
    <h1 data-i18n="start.title">Print the slides, not the ink</h1>
    <p class="sub" data-i18n="start.sub"></p>
    <!-- one dashed box: the walkthrough, then what to do; the whole box (and window) takes the drop -->
    <div class="dropzone">
  <div class="intro">
    <div class="introstage anim" id="intro-stage">
    <span class="hold" id="intro-hold"></span>
    <svg viewBox="0 0 720 300" role="img" aria-labelledby="intro-capAll">
      <defs>
        <linearGradient id="intro-glass" x1="0" x2="1">
          <stop offset="0" stop-color="var(--green)" stop-opacity=".30"/><stop offset=".18" stop-color="var(--green)" stop-opacity=".07"/>
          <stop offset=".82" stop-color="var(--green)" stop-opacity=".07"/><stop offset="1" stop-color="var(--green)" stop-opacity=".30"/>
        </linearGradient>
        <clipPath id="intro-above"><rect x="0" y="0" width="720" height="172"/></clipPath>
      </defs>

      <!-- 0 · problem: a dark slide comes out of the printer, the cartridge drains -->
      <g class="p0">
        <g clip-path="url(#intro-above)"><g class="sheet0">
          <rect x="296" y="56" width="128" height="116" fill="#1E2A44"/>
          <rect x="306" y="66" width="70" height="8" rx="2" fill="#E8EAED"/>
          <rect x="306" y="84" width="60" height="4" rx="2" fill="#E8EAED"/><rect x="306" y="94" width="54" height="4" rx="2" fill="#E8EAED"/>
          <rect x="372" y="84" width="44" height="34" fill="#5C6B7E"/><rect x="296" y="150" width="128" height="14" fill="#1E3A6E"/>
        </g></g>
        <rect x="270" y="168" width="180" height="56" rx="10" fill="var(--paper)" stroke="var(--ink)" stroke-width="2"/>
        <rect x="292" y="166" width="136" height="6" rx="3" fill="var(--ink)"/>
        <circle cx="430" cy="196" r="4" fill="var(--green)"/>
        <g transform="translate(520 92)">
          <rect width="40" height="124" rx="7" fill="none" stroke="var(--ink)" stroke-width="2.5"/>
          <rect class="drain" x="4" y="8" width="32" height="112" rx="4" fill="var(--ink)"/>
        </g>
      </g>

      <rect class="tray" x="196" y="56" width="328" height="188" rx="12" fill="none" stroke="var(--cyan)" stroke-width="2" stroke-dasharray="7 6"/>

      <!-- 2 · the laptop, the bell jar, the cloud it does not need -->
      <g class="laptop">
        <rect x="282" y="66" width="156" height="100" rx="8" fill="var(--paper)" stroke="var(--ink)" stroke-width="2"/>
        <path d="M262 176 H458 L472 206 Q472 212 466 212 H254 Q248 212 248 206 Z" fill="var(--paper)" stroke="var(--ink)" stroke-width="2"/>
        <g fill="var(--line)"><rect x="272" y="182" width="176" height="4" rx="2"/><rect x="268" y="189" width="184" height="4" rx="2"/>
          <rect x="264" y="196" width="192" height="4" rx="2"/><rect x="330" y="204" width="60" height="4" rx="2" fill="var(--muted)"/></g>
        <path class="cloud" d="M556 124 a24 24 0 0 1 8 -46 a30 30 0 0 1 56 -8 a22 22 0 0 1 22 38 a18 18 0 0 1 -10 16 z" fill="none" stroke="var(--muted)" stroke-width="2.5" stroke-linejoin="round"/>
        <path class="wire" d="M444 112 H552" fill="none" stroke="var(--muted)" stroke-width="2.5" stroke-linecap="round"/>
      </g>

      <!-- the slide: dark background, photo, a banner repeated on every page -->
      <g class="slide"><g class="cam">
        <rect x="200" y="60" width="320" height="180" rx="3" fill="#FFFFFF"/>
        <rect class="darkbg" x="200" y="60" width="320" height="180" rx="3" fill="#1E2A44"/>
        <g class="txtlight" fill="#E8EAED"><rect x="214" y="74" width="150" height="12" rx="2"/>
          <rect x="214" y="104" width="122" height="6" rx="2"/><rect x="214" y="118" width="110" height="6" rx="2"/>
          <rect x="214" y="132" width="126" height="6" rx="2"/><rect x="214" y="146" width="96" height="6" rx="2"/></g>
        <g class="txtdark" fill="#1C1F23"><rect x="214" y="74" width="150" height="12" rx="2"/>
          <rect x="214" y="104" width="122" height="6" rx="2"/><rect x="214" y="118" width="110" height="6" rx="2"/>
          <rect x="214" y="132" width="126" height="6" rx="2"/><rect x="214" y="146" width="96" height="6" rx="2"/></g>
        <g class="gone"><rect x="360" y="98" width="146" height="100" rx="2" fill="#5C6B7E"/>
          <path d="M360 198 L402 152 L432 178 L462 140 L506 198 Z" fill="#3E4A59"/><circle cx="482" cy="120" r="9" fill="#C9D3DE"/></g>
        <g class="gone"><rect x="200" y="214" width="320" height="26" fill="#1E3A6E"/>
          <rect x="212" y="224" width="70" height="6" rx="2" fill="#9DB4DA"/><rect x="470" y="221" width="38" height="12" rx="2" fill="#F2C230"/></g>
        <g class="xray">
          <rect x="200" y="60" width="320" height="180" rx="3" fill="#0B1A2E" opacity=".92"/>
          <g fill="none" stroke="var(--cyan)" stroke-width="2.5">
            <rect x="214" y="74" width="150" height="12"/><rect x="214" y="104" width="126" height="48" stroke-dasharray="4 4"/>
            <rect x="360" y="98" width="146" height="100"/><rect x="200" y="214" width="320" height="26"/>
          </g>
        </g>
        <rect class="scan" x="200" y="60" width="5" height="180" fill="var(--cyan)"/>
        <!-- found by the program, in the app's own class colours -->
        <rect class="m1" x="203" y="63" width="314" height="148" fill="none" stroke="var(--magenta)" stroke-width="2.5" stroke-dasharray="6 4"/>
        <rect class="m2" x="356" y="94" width="154" height="108" fill="none" stroke="var(--sky)" stroke-width="3"/>
        <rect class="m3" x="198" y="211" width="324" height="32" fill="none" stroke="var(--yellow)" stroke-width="3"/>
      </g></g>

      <g class="dome">
        <path d="M222 214 V100 C222 26 498 26 498 100 V214" fill="url(#intro-glass)" stroke="var(--green)" stroke-width="2"/>
        <ellipse cx="360" cy="214" rx="138" ry="12" fill="none" stroke="var(--green)" stroke-width="2"/>
        <ellipse cx="360" cy="45" rx="14" ry="5" fill="var(--green)"/>
        <path d="M240 196 V104 C240 74 262 56 292 48" fill="none" stroke="#FFFFFF" stroke-opacity=".35" stroke-width="6" stroke-linecap="round"/>
        <path d="M480 150 V112" fill="none" stroke="#FFFFFF" stroke-opacity=".18" stroke-width="4" stroke-linecap="round"/>
      </g>
      <g transform="translate(478 196)"><g class="safe">
        <circle r="16" fill="var(--green)"/>
        <path d="M-5 -1 v-3 a5 5 0 0 1 10 0 v3 M-7 -1 h14 v10 h-14 z" fill="none" stroke="var(--panel)" stroke-width="2" stroke-linejoin="round"/>
      </g></g>

      <!-- the one click -->
      <g class="rmbtn"><rect x="440" y="250" width="84" height="28" rx="6" fill="var(--cyan)"/>
        <text x="482" y="268.5" text-anchor="middle" font-size="13" font-weight="600" fill="#08202B" id="intro-rmTxt"></text></g>
      <g id="intro-vapour"></g>

      <!-- 4 · result: two pages; under each, the ink it takes. A drop marks the bar as ink. -->
      <g class="result">
        <g class="before">
          <text x="250" y="52" text-anchor="middle" font-size="15" font-weight="700" fill="var(--muted)" id="intro-lblBefore"></text>
          <rect x="170" y="66" width="160" height="104" rx="3" fill="#1E2A44"/>
          <rect x="182" y="78" width="76" height="9" rx="2" fill="#E8EAED"/>
          <rect x="182" y="98" width="62" height="4" rx="2" fill="#E8EAED"/><rect x="182" y="108" width="56" height="4" rx="2" fill="#E8EAED"/>
          <rect x="182" y="118" width="60" height="4" rx="2" fill="#E8EAED"/>
          <rect x="262" y="94" width="58" height="46" fill="#5C6B7E"/><rect x="170" y="152" width="160" height="18" fill="#1E3A6E"/>
          <path d="M162 190 c-4 6 -6 9 -6 12 a6 6 0 0 0 12 0 c0 -3 -2 -6 -6 -12 z" fill="var(--ink)"/>
          <rect class="use1" x="174" y="192" width="156" height="12" rx="6" fill="var(--ink)"/>
        </g>
        <path d="M350 118 h20 m-8 -8 l8 8 l-8 8" fill="none" stroke="var(--muted)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <g class="nowside">
          <text x="470" y="52" text-anchor="middle" font-size="15" font-weight="700" fill="var(--green)" id="intro-lblAfter"></text>
          <rect x="390" y="66" width="160" height="104" rx="3" fill="#FFFFFF"/>
          <rect x="402" y="78" width="76" height="9" rx="2" fill="#1C1F23"/>
          <rect x="402" y="98" width="62" height="4" rx="2" fill="#1C1F23"/><rect x="402" y="108" width="56" height="4" rx="2" fill="#1C1F23"/>
          <rect x="402" y="118" width="60" height="4" rx="2" fill="#1C1F23"/><rect x="402" y="128" width="44" height="4" rx="2" fill="#1C1F23"/>
          <path d="M382 190 c-4 6 -6 9 -6 12 a6 6 0 0 0 12 0 c0 -3 -2 -6 -6 -12 z" fill="var(--ink)"/>
          <rect class="spared" x="394" y="192" width="156" height="12" rx="6" fill="none" stroke="var(--green)" stroke-width="1.5" stroke-dasharray="4 4"/>
          <rect class="use2" x="394" y="192" width="117" height="12" rx="6" fill="var(--ink)"/>
          <!-- leaf seal stamped on the clean page -->
          <g transform="translate(528 148)"><g class="seal">
            <circle r="17" fill="none" stroke="var(--green)" stroke-width="2"/>
            <circle r="13" fill="var(--green)" fill-opacity=".15"/>
            <path d="M-2 7 C-9 3 -9 -6 2 -10 C7 -2 5 5 -2 7 Z M-2 7 L4 -4" fill="var(--green)" stroke="var(--green)" stroke-width="1.2" stroke-linecap="round"/>
          </g></g>
        </g>
      </g>

      <g class="file">
        <rect x="20" y="96" width="70" height="88" rx="6" fill="var(--paper)" stroke="var(--line)"/>
        <rect x="30" y="108" width="50" height="28" rx="2" fill="#1E2A44"/>
        <rect x="58" y="112" width="18" height="12" rx="1" fill="#5C6B7E"/><rect x="30" y="130" width="50" height="6" fill="#1E3A6E"/>
        <rect x="30" y="146" width="40" height="4" rx="2" fill="var(--muted)"/><rect x="30" y="156" width="30" height="4" rx="2" fill="var(--muted)"/>
        <text x="55" y="176" text-anchor="middle" font-size="11" font-weight="700" fill="#F0679E">PDF</text>
      </g>
      <path class="cur1" d="M70 150 l0 22 l6 -6 l4 9 l4 -2 l-4 -9 l8 0 z" fill="var(--ink)" stroke="var(--panel)" stroke-width="1.5"/>
      <path class="cur2" d="M600 280 l0 22 l6 -6 l4 9 l4 -2 l-4 -9 l8 0 z" fill="var(--ink)" stroke="var(--panel)" stroke-width="1.5"/>
    </svg>
    <div class="caps" aria-hidden="true">
      <div class="cap c0"><b id="intro-h0"></b><span id="intro-t0"></span></div>
      <div class="cap c1"><b id="intro-h1"></b><span id="intro-t1"></span></div>
      <div class="cap c2"><b id="intro-h2"></b><span id="intro-t2"></span></div>
      <div class="cap c3"><b id="intro-h3"></b><span id="intro-t3"></span></div>
      <div class="cap c4"><b id="intro-h4"></b><span id="intro-t4"></span></div>
    </div>
    <nav class="scenes" id="intro-scenes">
      <button data-at=".07"><i></i></button>
      <button data-at=".17"><i></i></button>
      <button data-at=".355"><i></i></button>
      <button data-at=".555"><i></i></button>
      <button data-at=".9"><i></i></button>
    </nav>
    <span id="intro-capAll" hidden></span>
  </div>
    </div>
      <strong data-i18n="start.drop">Drag your PDF here</strong>
      <p class="hint" data-i18n="start.original"></p>
      <label class="btn primary" for="file" data-i18n="empty.choose">Choose PDF</label>
    </div>
    <section class="recent" id="recent" hidden>
      <div class="recenthead"><h2 data-i18n="recent.title"></h2><button class="btn ghost small" id="recentClear" data-i18n="recent.clear"></button></div>
      <ol class="recentlist" id="recentList"></ol>
    </section>
  </div>
</div>

<!-- Drag feedback over the whole window, also when a document is already open. -->
<div id="dropveil" class="dropveil" hidden>
  <div class="dropcard">
    <svg class="dropicon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0-5-5m5 5 5-5M4 17v3h16v-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <strong id="dropMsg"></strong>
  </div>
</div>

<!-- Opening progress: upload (measured) → reading pages (server, indeterminate) → first preview. -->
<div id="loader" class="loader" hidden role="status" aria-live="polite">
  <div class="loadcard">
    <div class="spinner" aria-hidden="true"></div>
    <strong id="loadTitle"></strong>
    <span id="loadFile" class="loadfile"></span>
    <div class="progress" id="loadBarWrap"><i id="loadBar"></i></div>
    <span id="loadHint" class="loadhint"></span>
  </div>
</div>

<!-- Export reward: the dots that were not printed light up a pointillist globe (saved total kept per user). -->
<div id="world" class="world" hidden role="dialog" aria-modal="true" aria-labelledby="worldHead">
  <div class="worldcard">
    <canvas id="worldCanvas" width="560" height="560" aria-hidden="true"></canvas>
    <div class="worldtext" aria-live="polite">
      <strong id="worldHead"></strong>
      <span id="worldDots"></span>
      <span id="worldLit"></span>
      <small id="worldTotal"></small>
      <button class="btn primary" id="worldClose" hidden data-i18n="world.close">Close</button>
    </div>
  </div>
</div>

<div id="menu" class="menu" role="menu" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>
<script src="/static/app.js?v=0.4"></script>
</body>
</html>
