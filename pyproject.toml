[project]
name = "pdf-distiller"
version = "0.5.0"
description = "Strip backgrounds, themes and images from lecture slides before printing. Runs locally."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "pikepdf>=9.0",          # PDF read/write (MPL-2.0)
  "pypdfium2>=4.30",       # page rendering (Apache-2.0 / BSD-3)
  "Pillow>=10.0",
  "numpy>=1.26",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
window = ["pywebview>=5.0"]   # desktop window: python run.py --window
dev = [
  "pytest>=8.0",
  # FastAPI TestClient: Starlette 1.10+ wants httpx2 (Python 3.11+); older setups use httpx
  "httpx2>=2.16; python_version >= '3.11'",
  "httpx>=0.27; python_version < '3.11'",
  "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

# The app runs from this folder (python run.py); installing only pulls in the dependencies.
[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py310"
extend-exclude = ["tests/samples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
  "UP031",  # %-formatting is kept for PDF operator output
  "B008",   # FastAPI's File(...) default is the documented pattern
]

[tool.ruff.lint.per-file-ignores]
"distill_core/interpreter.py" = ["E701"]  # one-line min/max updates in the hot bbox loop
"docs/make_story_i18n.py" = ["E501"]
"docs/make_inside_i18n.py" = ["E501"]  # translation table lines read better unbroken
