  <style>
    /* Light colours are the original design. In the app the page sets --pdl-* per theme (style.css);
       opened on its own (favicon, Finder) the system theme picks: svg:root only matches then. */
    .pdl-paper { fill: var(--pdl-paper, #FFFFFF); }
    .pdl-fold  { fill: var(--pdl-fold, #ECEEED); }
    .pdl-line  { stroke: var(--pdl-line, #2C2C2A); }
    .pdl-blue  { fill: var(--pdl-blue, #0C447C); }
    .pdl-green { fill: var(--pdl-green, #639922); }
    .pdl-rib   { fill: var(--pdl-rib, #3B6D11); }
    @media (prefers-color-scheme: dark) {
      svg:root { --pdl-paper: #2A2F35; --pdl-fold: #3A4048; --pdl-line: #E8EAED; --pdl-blue: #6FA8E8;
                 --pdl-green: #7DB33A; --pdl-rib: #4E8A17; }
    }
  </style>
